name: Randomized simulation guard
on:
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fuzz/run.ts --seconds 1200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-repros-${{ github.run_id }}
          path: fuzz-repros/
          if-no-files-found: warn
          retention-days: 30
